<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Паралакс ефект</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Блок з картинками (паралакс контейнер) -->
        <div class="parallax-container">
            <!-- Шар 3 (задній план) - синє коло -->
            <img id="layer3" class="layer layer-3" src="1/3.png" alt="Layer 3">

            <!-- Шар 2 (середній план) - зелене коло -->
            <img id="layer2" class="layer layer-2" src="1/2.png" alt="Layer 2">

            <!-- Шар 1 (передній план) - червоне коло -->
            <img id="layer1" class="layer layer-1" src="1/1.png" alt="Layer 1">
        </div>

        <!-- Панель кнопок -->
        <div class="button-panel">
            <button class="nav-button active" data-set="1">1</button>
            <button class="nav-button" data-set="2">2</button>
            <button class="nav-button" data-set="3">3</button>
            <button class="nav-button" data-set="4">4</button>
            <button class="nav-button" data-set="5">5</button>
            <button class="nav-button" data-set="6">6</button>
            <button class="nav-button" data-set="7">7</button>
            <button class="nav-button" data-set="8">8</button>
            <button class="nav-button" data-set="9">9</button>
            <button class="nav-button" data-set="10">10</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
